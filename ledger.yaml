stage_review_records:
  V2A:
    decision: decisions/D-V2A-REVIEW-01.json
    verdict: "V2A attempt 1: ACCEPTED WITH CONDITIONS. Reviewer: external (operator relay).\nConditions, fixed in\
      \ V2B without a new V2A attempt:\nC1 FINDINGS wording: far-corner is a control strategy, not a nondegeneracy\n\
      \   failure. The degenerate result is lead-2.0: with the accepted neural escape\n   the catch rate is 0.988\
      \ versus 0.696 with no escape, so escaping makes the\n   fly easier to catch and one trivial strategy dominates.\n\
      C2 FINDINGS must state plainly that the accepted neural controller is\n   behaviorally identical to a fixed\
      \ 30 ms timer in the current game (offset\n   variance zero, 100% paired outcome match). Public claims must\
      \ not imply\n   that the v1 connectome changes game behavior.\nC3 Null diagnostics must key reachability and\
      \ path lengths by body ID, not by\n   local index.\nC4 Scaffold tests must not hard-code the exact stage map;\
      \ they must accept\n   SUBMITTED and ACCEPTED values and require that only the reviewer verdict\n   record\
      \ can set ACCEPTED."
  V2B:
    decision: decisions/D-V2B-REVIEW-01.json
    verdict: "V2B attempt 1: ACCEPTED WITH CONDITIONS. Reviewer: external (operator relay).\nB0, B1, B2, B3, B5\
      \ (reference, kernel, noise parity, decoder, body) and B7 are\naccepted. B4 and the B5 encoder are accepted\
      \ with required fixes. The B6 dry\nrun is recorded as a FAILED DRY RUN THAT FOUND DEFECTS, not as model evidence.\n\
      Its \"inverted looming control\" and \"all rows silent\" outcomes are caused by\nimplementation and design\
      \ defects, not by the circuit:\nD1 encoding_v2.py swaps the populations: LC4 receives angular size and LPLC2\n\
      \   receives expansion. Plan v2 and Ache et al. 2019 require LC4 = expansion\n   (angular velocity) and LPLC2\
      \ = angular size.\nD2 Expansion is not normalized. It is in rad/ms and about 50 times smaller\n   than angular\
      \ size in rad, so expansion contributes almost nothing.\nD3 The dry-run looming stimulus continues at full\
      \ size after impact for the rest\n   of the trial, and the matched non-looming control applies full final\
      \ size\n   from t = 0. The control therefore receives more drive for longer.\nD4 Noise and synaptic scale\
      \ grids are orders of magnitude too small. With\n   p = 0.01 per tick and w = 0.05 the steady free membrane\
      \ potential is about\n   0.005 of threshold. One contact at scale 0.003 gives a peak PSP of about\n   0.0005\
      \ of threshold, so multi-hop signals cannot propagate.\nD5 The draft criterion \"looming escape exceeds non-looming\
      \ by 0.10\" is also an\n   H1 outcome metric. Calibrating on an outcome is circular.\nD6 The draft criteria\
      \ contain no false-escape limit.\nD7 atan_approx has about 5.8% relative error at small angles (slope 1.058\
      \ at 0).\nD8 The u32 mixer combines all counters linearly before a single finalizer, so\n   (tick, index)\
      \ pairs can collide along lattice lines.\nReviewer decisions on V2B questions are in C1, C2 and C4 of the\
      \ V2C prompt."
  V2C:
    decision: decisions/D-V2C-REVIEW-01.json
    verdict: "V2C attempt 1: ACCEPTED WITH CONDITIONS. Reviewer: external (operator relay).\nC0 to C9 are accepted.\
      \ The C7 dry run is recorded as a FAILED DRY RUN THAT\nFOUND DESIGN DEFECTS, not as model evidence. Conditions\
      \ for V2D:\nE1 Noise population. Noise on every neuron makes the criteria unreachable and\n   weakens H2:\
      \ DNp01 receiving its own noise fires at about nu0, so false onsets\n   are at least about 2 x nu0 per second\
      \ (1 per second at nu0 = 0.5 Hz) against\n   a 0.05 per second ceiling, and noise on walking DNs makes movement\
      \ mostly\n   injected noise, collapsing H2 into the noise-to-decoder control. Visual port\n   input is defined\
      \ by the encoder. New rule: background noise goes to every\n   circuit neuron except visual ports (LC4, LPLC2)\
      \ and all decoder output ports\n   in ports-v2.1 (including DNb02). Spontaneous output must arise in the\n\
      \   interior and reach the outputs through the wiring.\nE2 Movement definition. A control interval is moving\
      \ when |speed| >= 0.002\n   units/ms (10% of maximum forward speed) or |turn| >= 0.0005 rad/ms (10% of\n \
      \  maximum turn rate). The same deadband defines bouts and pauses.\nE3 Noise fitting. Fit p by bisection on\
      \ the pooled spike count of 4 fixed seeds\n   x 1000 s (common random numbers through the bisection); validate\
      \ on 2 new\n   seeds x 2000 s each; pass when within max(5%, 3 Poisson standard errors) of\n   nu0. Failing\
      \ rows leave the grid and are reported.\nE4 Pre-registration details are fixed by the reviewer in the V2D\
      \ prompt.\nE5 The operator installs browser system libraries; V2D reruns the matrix.\nE6 analysis_v2.py segmentation\
      \ uses 0.001 / 0.0001; it must use the E2\n   deadband.\nConfirmed: fixed sensory pose and independent reset\
      \ per calibration and H1\ntrial; escape onset = rising edge of the escape request."
  V2D:
    decision: decisions/D-V2D-REVIEW-01.json
    verdict: "V2D attempt 1: ACCEPTED WITH CONDITIONS. Reviewer: external (operator relay).\nS0 to S3 and G1 to\
      \ G5 are accepted. The S4 G4 stop was correct: the V2D prompt\ndefined C-SIMPLE as a deterministic threshold,\
      \ which cannot match a fractional\nescape rate when standard trajectories are identical. This is recorded\
      \ as a\nreviewer design defect, not an implementation failure. The pooled E3\nvalidation is accepted. The\
      \ relative x/z brain map with disclosed unverified\nunits and orientation is accepted. Bot results are development\
      \ evidence only.\nConditions for V2E:\nF1 C-SIMPLE becomes a stochastic one-neuron baseline (defined in V2E).\n\
      F2 Pilot observation: in dry run 3 at s = 0.039, every pilot null (2 per family\n   per circuit) exceeded\
      \ 96 Hz whole-circuit no-threat rate while the real T1a\n   and T1b graphs stayed below 20 Hz. This motivates\
      \ a new confirmatory\n   hypothesis H0 (dynamic stability), tested only on fresh nulls. The pilot\n   nulls\
      \ are excluded. H0 is disclosed as pilot-motivated.\nF3 A sign-stratified null family N-SIGN is added.\nF4\
      \ Primary-circuit fallback rule for H1 and H2 (no real T1a subset point passed\n   in dry run 3; one real\
      \ T1b point passed).\nF5 The game must use a calibrated point; provisional-model issues: the fly\n   never\
      \ escaped and barely moved, the hand was not visible in the mid-strike\n   capture, the board is not the hero\
      \ on phones, brain-cam flashes are faint,\n   and the repository has no README."
