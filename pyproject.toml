[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flybench"
version = "0.0.0"
description = "Reproducible Catch the Fly experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pyarrow>=18,<24",
]

[project.scripts]
flybench = "flybench.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/flybench"]
