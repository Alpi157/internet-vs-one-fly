[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flybench"
version = "0.0.0"
description = "M01 repository and review harness for Catch the Fly"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/flybench"]
