<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catch the fly, phone game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&amp;family=Atkinson+Hyperlegible+Next:wght@200..800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#7FEFAA}a:hover{color:#B8F7CF}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #7FEFAA;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #E9EDE6; font-family: 'Atkinson Hyperlegible Next', sans-serif; padding: 20px 16px 24px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden">

  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <h1 style="margin: 0; font-family: 'Doto', sans-serif; font-size: 34px; line-height: 1.1; font-weight: 900">Catch the fly</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #A9B2AA; text-wrap: pretty">5,555 neurons, wired as mapped in a real male fruit fly.</p>
    </div>
    <button aria-label="How this works" style="flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A413B; background: transparent; color: #E9EDE6; font-size: 18px; font-weight: 700; cursor: pointer">?</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'Doto', sans-serif; font-size: 34px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums">2</span>
      <span style="font-size: 13px; line-height: 1.3; color: #9BA59C">caught</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 9px">
      <div style="display: flex; gap: 8px" aria-hidden="true">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #E9EDE6"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #E9EDE6"></span>
        <span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 2px solid #E9EDE6; display: flex; align-items: center; justify-content: center"><span style="width: 4px; height: 4px; border-radius: 50%; background: #E9EDE6"></span></span>
        <span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #3A413B"></span>
        <span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #3A413B"></span>
        <span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #3A413B"></span>
      </div>
      <span style="font-size: 13px; line-height: 1.3; color: #9BA59C">Hand 3 of 6</span>
    </div>
  </div>

    <div style="margin: 0 -16px; padding: 8px 0; display: flex; justify-content: center; overflow: hidden">
      <dc-import name="Field" size="{{430}}" hand="{{0.85}}" lands="{{88}}" pill="{{true}}" scale="{{true}}" hint-size="430px,430px"></dc-import>
    </div>
  </div>

    <div style="display: flex; align-items: center; gap: 16px">
      <p style="margin: 0; flex: 1; font-size: 16px; line-height: 1.45; color: #C9D0C8; text-wrap: pretty">Tap the fly to slap. Hold for a bigger, slower hand.</p>
      <sc-if value="{{showFlyView}}" hint-placeholder-val="{{true}}">
        <div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="position: relative; width: 64px; height: 64px; border-radius: 32px; overflow: hidden; background: #DCE2DA; box-shadow: 0 0 0 1px #3A413B">
            <sc-for list="{{hexes}}" as="h" hint-placeholder-count="80">
              <div style="position: absolute; left: {{h.x}}px; top: {{h.y}}px; width: 7px; height: 8px; background: {{h.c}}; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%)"></div>
            </sc-for>
          </div>
          <span style="font-size: 12px; line-height: 1.2; color: #9BA59C">What it sees</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 12px">
      <a href="Replay.dc.html" style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #3A413B; color: #E9EDE6; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.2 8 A4.8 4.8 0 1 0 5 4.3 M3 1.8 V5 H6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Replay last hand
      </a>
      <a href="Lab.dc.html" style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #3A413B; color: #E9EDE6; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4 H6 L10 12 H14 M2 12 H6 L7.4 9.2 M10 4 H14 M12 2 L14 4 L12 6 M12 10 L14 12 L12 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Wiring lab
      </a>
    </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showFlyView":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rng(seed) {
    var s = seed;
    return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  }
  hexGrid() {
    if (this._hex) return this._hex;
    var out = [], rnd = this.rng(7);
    var w = 7, h = 8, stepY = 6;
    for (var r = -1; r < 12; r++) {
      for (var c = -1; c < 11; c++) {
        var x = c * w + (r % 2 ? w / 2 : 0), y = r * stepY;
        var d = Math.hypot(x + w / 2 - 46, y + h / 2 - 18);
        var col = '#DCE2DA';
        if (d < 13) col = '#1B201D';
        else if (d < 18) col = '#3E4741';
        else if (d < 23) col = '#8E988F';
        else if (rnd() < 0.18) col = '#C9D0C7';
        out.push({ x: x.toFixed(1), y: y.toFixed(1), c: col });
      }
    }
    this._hex = out;
    return out;
  }
  renderVals() {
    return {
      showFlyView: this.props.showFlyView ?? true,
      hexes: this.hexGrid()
    };
  }
}
</script>
</body>
</html>
