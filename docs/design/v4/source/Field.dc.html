<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":358},"hand":{"editor":"range","min":0,"max":1,"step":0.05,"default":0.85},"lands":{"editor":"int","default":88},"pill":{"editor":"boolean","default":true},"scale":{"editor":"boolean","default":true},"$preview":{"width":358,"height":358}}'>
class Component extends DCLogic {
  rng(seed) {
    var s = seed;
    return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  }
  dots(n, seed, rMin, rMax, cx, cy, spread, fn) {
    var rnd = this.rng(seed), d = '';
    for (var i = 0; i < n; i++) {
      var p = fn(rnd);
      var r = rMin + rnd() * (rMax - rMin);
      d += 'M' + (p[0] - r).toFixed(2) + ' ' + p[1].toFixed(2) + 'a' + r.toFixed(2) + ' ' + r.toFixed(2) + ' 0 1 0 ' + (2 * r).toFixed(2) + ' 0a' + r.toFixed(2) + ' ' + r.toFixed(2) + ' 0 1 0 ' + (-2 * r).toFixed(2) + ' 0';
    }
    return d;
  }
  geo() {
    if (this._g) return this._g;
    var disc = function (rnd) { var a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 172; return [179 + Math.cos(a) * r, 179 + Math.sin(a) * r]; };
    var hairs = function (rnd) {
      var row = Math.floor(rnd() * 8), t = rnd();
      var x = 50.6 + row * 2.7 + (rnd() - 0.5) * 0.8;
      var y = 37 + t * 26;
      var dx = x - 60, dy = (y - 50.4) / 1.06;
      if (dx * dx + dy * dy > 15.5 * 15.5) { x = 60 + dx * 0.8; }
      return [x, y];
    };
    this._g = {
      dustA: this.dots(46, 41, 0.6, 1.9, 179, 179, 172, disc),
      dustB: this.dots(26, 77, 0.4, 1.1, 179, 179, 172, disc),
      micro: this.dots(64, 9, 0.22, 0.34, 60, 50, 14, hairs)
    };
    return this._g;
  }
  renderVals() {
    var p = this.props, g = this.geo();
    return {
      size: p.size ?? 358,
      hand: p.hand ?? 0.85,
      pillText: 'Hand lands in ' + (p.lands ?? 88) + ' ms',
      pill: p.pill ?? true,
      pillFont: Math.min(17, (p.size ?? 358) * 13.5 / 358).toFixed(1),
      scaleOpacity: (p.scale ?? true) ? 1 : 0,
      dustA: g.dustA,
      dustB: g.dustB,
      microchaetae: g.micro
    };
  }
}
</script>
