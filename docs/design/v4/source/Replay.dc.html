<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brain replay sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&amp;family=Atkinson+Hyperlegible+Next:wght@200..800&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#7FEFAA}a:hover{color:#B8F7CF}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #7FEFAA;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #000000; color: #E9EDE6; font-family: 'Atkinson Hyperlegible Next', sans-serif; overflow: hidden">

  <div style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <dc-import name="Main" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.64)"></div>

  <section aria-label="Replay of hand 3" style="position: absolute; left: 0; right: 0; top: 72px; bottom: 0; box-sizing: border-box; background: #0A0C0A; border-radius: 22px 22px 0 0; box-shadow: 0 -1px 0 #2A2F2B, 0 -24px 48px rgba(0,0,0,0.5); padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3A413B" aria-hidden="true"></div>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0; font-size: 13px; line-height: 1.3; color: #9BA59C">Hand 3 of 6</p>
        <h2 style="margin: 0; font-family: 'Doto', sans-serif; font-size: 40px; line-height: 1.1; font-weight: 900; color: #63F29A">Escaped</h2>
      </div>
      <a href="Main.dc.html" aria-label="Close replay" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #3A413B; color: #E9EDE6; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>
    </div>

    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #C9D0C8; text-wrap: pretty">Its giant fiber fired 21.5 ms before your hand landed. That one spike starts the jump.</p>

    <dc-import name="Brain" w="{{358}}" h="{{300}}" lplc2="{{0.95}}" lc4="{{0.55}}" gf="{{1}}" dn="{{0.15}}" interior="{{0.3}}" seizure="{{0}}" labels="{{true}}" hint-size="358px,300px"></dc-import>

    <svg viewBox="0 0 358 104" width="358" height="104" role="img" aria-label="Timeline of the strike. The hand falls, the looming detectors ramp up, and the giant fiber spikes 21.5 ms before the hand lands.">
      <g font-family="Atkinson Hyperlegible Next, sans-serif" font-size="12" fill="#9BA59C">
        <text x="0" y="20">Hand height</text>
        <text x="0" y="54">Looming cells</text>
        <text x="0" y="88">Giant fiber</text>
      </g>
      <line x1="104" y1="30" x2="356" y2="30" stroke="#1E231F"/>
      <line x1="104" y1="64" x2="356" y2="64" stroke="#1E231F"/>
      <line x1="104" y1="98" x2="356" y2="98" stroke="#1E231F"/>
      <path d="M104 6 C180 8 250 16 316 29" stroke="#C9D0C8" stroke-width="1.6" fill="none"/>
      <path d="M104 63.5 L228 63 C262 61 280 52 298 42 L316 40 L316 64 L104 64 Z" fill="#63F29A" fill-opacity="0.22"/>
      <path d="M104 63.5 L228 63 C262 61 280 52 298 42 L316 40" stroke="#63F29A" stroke-width="1.4" fill="none"/>
      <g stroke="#63F29A" stroke-width="2" stroke-linecap="round">
        <line x1="295" y1="78" x2="295" y2="96"/>
        <line x1="300" y1="78" x2="300" y2="96"/>
        <line x1="305" y1="78" x2="305" y2="96"/>
        <line x1="309.5" y1="78" x2="309.5" y2="96"/>
        <line x1="313.5" y1="78" x2="313.5" y2="96"/>
      </g>
      <line x1="316" y1="2" x2="316" y2="100" stroke="#E9EDE6" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="248" y1="2" x2="248" y2="100" stroke="#7FEFAA" stroke-width="1.6"/>
      <circle cx="248" cy="2.5" r="2.5" fill="#7FEFAA"/>
    </svg>
    <div style="display: flex; justify-content: space-between; margin-top: -8px; padding-left: 104px; font-size: 12px; line-height: 1.3; color: #9BA59C; font-variant-numeric: tabular-nums">
      <span>-120 ms</span>
      <span style="color: #E9EDE6">hand lands</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px">
      <button aria-label="Pause replay" style="flex: none; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A413B; background: transparent; color: #E9EDE6; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3 V13 M11 3 V13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #9BA59C">Quarter speed. Every flash is a spike from this strike.</p>
    </div>

    <div style="display: flex; gap: 12px; margin-top: auto">
      <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 26px; background: #E9EDE6; color: #0A0C0A; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Next hand</a>
      <button style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #3A413B; background: transparent; color: #E9EDE6; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2 V10 M4.5 6.5 L8 10 L11.5 6.5 M2.5 13.5 H13.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save clip
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
